<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrewCast — Company Follow Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

    .header { background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%); border-bottom: 1px solid #30363d; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .header h1 span { color: #0077B5; }
    .header-meta { font-size: 11px; color: #8b949e; margin-top: 4px; }
    .stats { display: flex; gap: 20px; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat-num { font-size: 26px; font-weight: 800; color: #0077B5; }
    .stat-label { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }

    .filters { padding: 14px 32px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn { padding: 5px 14px; border-radius: 20px; border: 1px solid #30363d; background: transparent; color: #8b949e; cursor: pointer; font-size: 12px; transition: all 0.2s; }
    .filter-btn.active { background: #0077B5; border-color: #0077B5; color: white; }
    .filter-btn:hover:not(.active) { border-color: #0077B5; color: #58a6ff; }

    .container { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
    .section-title { font-size: 15px; font-weight: 700; color: #58a6ff; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #30363d; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; margin-bottom: 40px; }

    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; transition: transform 0.2s, opacity 0.3s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,119,181,0.15); }
    .card-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; background: #1c2128; border-bottom: 1px solid #30363d; }
    .company-name { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .meta { font-size: 12px; color: #8b949e; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .badge-new      { background: #1d4ed8; color: #bfdbfe; }
    .badge-followed { background: #065f46; color: #a7f3d0; }
    .badge-skipped  { background: #374151; color: #9ca3af; }
    .badge-offbase  { background: #7f1d1d; color: #fca5a5; }

    .card-body { padding: 16px 20px; }
    .revenue { font-size: 13px; color: #58a6ff; margin-bottom: 8px; font-weight: 600; }
    .specialties { font-size: 12px; color: #8b949e; margin-bottom: 8px; line-height: 1.5; }
    .angle { font-size: 12px; color: #c9d1d9; line-height: 1.5; background: #0d1117; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #0077B5; }

    .card-footer { padding: 12px 20px; border-top: 1px solid #30363d; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn-linkedin  { display: inline-flex; align-items: center; gap: 6px; background: #0077B5; color: white; text-decoration: none; padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; transition: background 0.2s; }
    .btn-linkedin:hover { background: #005885; }
    .btn-followed  { background: transparent; border: 1px solid #4CAF50; color: #4CAF50; padding: 6px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; transition: all 0.2s; margin-left: auto; }
    .btn-followed:hover:not(:disabled) { background: #4CAF50; color: #000; }
    .btn-followed:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-skip    { background: transparent; border: 1px solid #8b949e; color: #8b949e; padding: 6px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
    .btn-skip:hover { border-color: #f0883e; color: #f0883e; }
    .btn-offbase { background: transparent; border: 1px solid #f85149; color: #f85149; padding: 6px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
    .btn-offbase:hover { background: #f85149; color: #fff; }

    .loading { text-align: center; padding: 80px 20px; color: #8b949e; }
    .loading-spinner { font-size: 32px; animation: spin 1s linear infinite; display: block; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 60px 20px; color: #8b949e; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { background: #da3633; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>CrewCast <span>Company Follow Portal</span></h1>
    <p class="header-meta" id="last-updated">Loading...</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-new">—</div><div class="stat-label">To Follow</div></div>
    <div class="stat"><div class="stat-num" id="stat-followed">—</div><div class="stat-label">Following</div></div>
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total</div></div>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('ALL', this)">All</button>
  <button class="filter-btn" onclick="setFilter('NEW', this)">🔵 To Follow</button>
  <button class="filter-btn" onclick="setFilter('FOLLOWED', this)">✅ Following</button>
  <button class="filter-btn" onclick="setFilter('SKIPPED', this)">⏭ Skipped</button>
</div>

<div class="container">
  <div id="grid-wrapper">
    <div class="loading"><span class="loading-spinner">⚙️</span>Loading companies...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = 'https://base44.app/api/apps/6a274334d6b0962f39294123/functions';
  let allCompanies = [];
  let currentFilter = 'ALL';

  async function loadCompanies() {
    try {
      const res  = await fetch(API_BASE + '/getCompanyStatuses', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
      const data = await res.json();
      allCompanies = (data.companies || []).filter(c => c.status !== 'OFF_BASE');
      renderAll();
      updateStats();
      document.getElementById('last-updated').textContent =
        'Live data · ' + new Date().toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }) + ' ET';
    } catch(e) {
      document.getElementById('grid-wrapper').innerHTML = '<div class="empty">⚠️ Error loading companies. Refresh to try again.</div>';
    }
  }

  function updateStats() {
    const visible = allCompanies.filter(c => c.status !== 'OFF_BASE');
    document.getElementById('stat-new').textContent      = visible.filter(c => c.status === 'NEW' || !c.status).length;
    document.getElementById('stat-followed').textContent = visible.filter(c => c.status === 'FOLLOWED').length;
    document.getElementById('stat-total').textContent    = visible.length;
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAll();
  }

  function matchesFilter(c) {
    const s = c.status || 'NEW';
    if (currentFilter === 'ALL') return true;
    return s === currentFilter;
  }

  function renderAll() {
    const visible = allCompanies.filter(matchesFilter);
    const wrapper = document.getElementById('grid-wrapper');
    if (visible.length === 0) {
      wrapper.innerHTML = '<div class="empty">Nothing here — try a different filter.</div>';
      return;
    }
    wrapper.innerHTML = `<div class="section-title">${visible.length} compan${visible.length !== 1 ? 'ies' : 'y'}</div><div class="grid" id="main-grid"></div>`;
    const grid = document.getElementById('main-grid');
    visible.forEach(c => grid.appendChild(buildCard(c)));
  }

  function buildCard(c) {
    const status = c.status || 'NEW';
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id     = c.id;
    div.dataset.status = status;

    const badgeMap = {
      NEW:      ['badge-new',      '🔵 To Follow'],
      FOLLOWED: ['badge-followed', '✅ Following'],
      SKIPPED:  ['badge-skipped',  '⏭ Skipped'],
      OFF_BASE: ['badge-offbase',  '🚫 Off Base'],
    };
    const [badgeClass, badgeLabel] = badgeMap[status] || badgeMap.NEW;

    const metaParts = [c.sector || '', c.headquarters || '', c.employee_count ? c.employee_count + ' employees' : ''].filter(Boolean).join(' · ');
    const angle = c.engagement_angle || c.follow_strategy || '';
    const revenue = c.revenue_estimate || '';

    const actionBtn = status === 'NEW' || status === 'SKIPPED'
      ? `<button class="btn-followed" onclick="markFollowed('${c.id}', this)">✅ Mark Followed</button>`
      : `<button class="btn-followed" disabled>✅ Following</button>`;

    const skipOffBase = status !== 'FOLLOWED'
      ? `<button class="btn-skip"    onclick="markStatus('${c.id}','SKIPPED',this)">⏭ Skip</button>
         <button class="btn-offbase" onclick="markStatus('${c.id}','OFF_BASE',this)">🚫 Off Base</button>`
      : '';

    div.innerHTML = `
      <div class="card-header">
        <div>
          <h3 class="company-name">${esc(c.company_name || 'Unknown')}</h3>
          <p class="meta">${esc(metaParts)}</p>
        </div>
        <span class="badge ${badgeClass}">${badgeLabel}</span>
      </div>
      <div class="card-body">
        ${revenue ? `<p class="revenue">💰 ${esc(revenue)}</p>` : ''}
        ${angle ? `<p class="angle"><strong>Why CrewCast:</strong> ${esc(angle)}</p>` : ''}
      </div>
      <div class="card-footer">
        <a href="${esc(c.linkedin_url || '#')}" target="_blank" class="btn-linkedin">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          View on LinkedIn
        </a>
        ${actionBtn}
        ${skipOffBase}
      </div>`;

    return div;
  }

  async function markFollowed(id, btn) {
    await markStatus(id, 'FOLLOWED', btn);
  }

  async function markStatus(id, newStatus, btn) {
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = '...';

    try {
      const res = await fetch(API_BASE + '/updateCompanyStatus', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, status: newStatus })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);

      // Update local state
      const c = allCompanies.find(x => x.id === id);
      if (c) c.status = newStatus;

      if (newStatus === 'OFF_BASE' || newStatus === 'SKIPPED') {
        const card = btn.closest('.card');
        card.style.opacity = '0';
        setTimeout(() => { card.style.display = 'none'; updateStats(); }, 300);
      } else {
        const card = btn.closest('.card');
        const newCard = buildCard(c);
        card.replaceWith(newCard);
        updateStats();
      }

      const msgs = { FOLLOWED: 'Marked as Following ✅', SKIPPED: 'Skipped — carries over tomorrow', OFF_BASE: 'Marked Off Base' };
      showToast(msgs[newStatus] || 'Updated!');
    } catch(e) {
      btn.disabled = false;
      btn.textContent = orig;
      showToast('Error saving — try again', true);
    }
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadCompanies();
</script>
</body>
</html>
