.stage-pill.new{background:#bee3f8;color:#2c5282}

.angle-block{margin:12px 0 8px;padding:10px 12px;background:#f7fafc;border-left:4px solid #4299e1;border-radius:0 5px 5px 0;font-size:12px;color:#2d3748;line-height:1.55;flex:1}

.strategy-label{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;color:#276749}
.inactive-msg{padding:10px 12px;background:#f7fafc;border-radius:6px;font-size:12px;color:#718096;text-align:center}
.card-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 12px;font-size:12px;border:none;border-radius:5px;cursor:pointer;transition:all .15s;font-weight:600;white-space:nowrap}

footer{text-align:center;padding:24px;color:#718096;font-size:12px;border-top:1px solid #e2e8f0;margin-top:8px}

let statusMap = {};

function getStatus(id) { return statusMap[id] || 'NEW'; }

function updateStats() {
  const total = COMPANIES.length;
  let needFollow = 0, followed = 0, offbase = 0, badlink = 0;
  COMPANIES.forEach(c => {
    const s = getStatus(c.id);
    if (s === 'NEW') needFollow++;
    else if (s === 'FOLLOWED') followed++;
    else if (s === 'OFF_BASE') offbase++;
    else if (s === 'BAD_LINK') badlink++;
  });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-new').textContent = needFollow;
  document.getElementById('s-followed').textContent = followed;
  document.getElementById('s-offbase').textContent = offbase;
  document.getElementById('s-badlink').textContent = badlink;
}

function pillClass(s) {
  return s === 'FOLLOWED' ? 'followed' : s === 'OFF_BASE' ? 'off-base' : s === 'BAD_LINK' ? 'bad-link' : s === 'SKIPPED' ? 'skipped' : 'new';
}
function pillLabel(s) {
  return s === 'FOLLOWED' ? '✅ Followed' : s === 'OFF_BASE' ? '🚫 Off Base' : s === 'BAD_LINK' ? '🚩 Bad Link' : s === 'SKIPPED' ? 'Skipped' : '🔵 Follow Now';
}

function renderCard(c) {
  const s = getStatus(c.id);
  const inactive = ['FOLLOWED','OFF_BASE','BAD_LINK','SKIPPED'].includes(s);
  const card = document.createElement('div');
  card.id = 'card-' + c.id;
  card.className = `card ${inactive && s !== 'FOLLOWED' ? 'done' : ''} ${s === 'OFF_BASE' ? 'off-base' : ''} ${s === 'BAD_LINK' ? 'bad-link' : ''}`.trim();

  const contentHtml = inactive && s !== 'NEW'
    ? `<div class="inactive-msg">${
        s === 'FOLLOWED' ? '✅ Company followed on LinkedIn' :
        s === 'OFF_BASE' ? '🚫 Flagged as off ICP — excluded from future research' :
        s === 'BAD_LINK' ? '🚩 LinkedIn URL flagged as broken' :
        '⏭️ Skipped'
      }</div>`
    : `<div class="angle-block">${c.engagement_angle}</div>
       <div class="strategy-block"><div class="strategy-label">📋 Follow Strategy</div>${c.follow_strategy}</div>`;

  const actionsHtml = s === 'NEW'
    ? `<div class="card-actions">
        <button class="btn btn-linkedin" onclick="openLI('${c.linkedin_url}','${c.id}')">🔗 LinkedIn</button>
        <button class="btn btn-follow" onclick="setStatus('${c.id}','FOLLOWED')">✓ Followed</button>
      </div>
      <div class="card-actions" style="margin-top:4px">
        <button class="btn btn-skip" onclick="setStatus('${c.id}','SKIPPED')">Skip</button>
        <button class="btn btn-offbase" onclick="setStatus('${c.id}','OFF_BASE')">🚫 Off Base</button>
        <button class="btn btn-badlink" onclick="setStatus('${c.id}','BAD_LINK')">🚩 Bad Link</button>
      </div>`
    : '';

  card.innerHTML = `
    <div class="card-head">
      <div class="company-name">${c.company_name}</div>
      <div class="company-meta">${c.sector}</div>
      <div class="company-hq">📍 ${c.headquarters} · ${c.revenue_estimate} · ${c.employee_count} emp</div>
      <span class="stage-pill ${pillClass(s)}">${pillLabel(s)}</span>
    </div>
    ${contentHtml}
    ${actionsHtml}
  `;
  return card;
}

function renderAll() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  const order = { 'NEW': 0, 'FOLLOWED': 1, 'SKIPPED': 2, 'OFF_BASE': 3, 'BAD_LINK': 4 };
  const sorted = [...COMPANIES].sort((a,b) => (order[getStatus(a.id)]||0) - (order[getStatus(b.id)]||0));
  sorted.forEach(c => container.appendChild(renderCard(c)));
  updateStats();
}

function openLI(url, id) {
  if (!url || !url.includes('/company/')) {
    setStatus(id, 'BAD_LINK');
    alert('LinkedIn URL looks invalid — marked as Bad Link.');
    return;
  }
  window.open(url, '_blank');
}

async function setStatus(id, status) {
  statusMap[id] = status;
  const old = document.getElementById('card-' + id);
  if (old) old.replaceWith(renderCard(COMPANIES.find(c => c.id === id)));
  updateStats();
  try {
    await fetch(`${API}/updateCompanyStatus`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company_id: id, status })
    });
  } catch(e) { console.log('Save failed:', e); }
}

(async () => {
  try {
    const r = await fetch(`${API}/getCompanyStatuses`, { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const d = await r.json();
    if (d.statuses) d.statuses.forEach(s => { statusMap[s.company_id] = s.status; });
  } catch(e) { console.log('Load failed:', e); }
  renderAll();
})();
</script>
