<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrewCast — Company Follow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;color:#1a202c}
header{background:#1a202c;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
h1{font-size:18px;font-weight:700}
.sub{font-size:12px;color:#a0aec0;margin-top:2px}
.nav a{color:#a0aec0;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px;margin-left:8px}
.nav a:hover{background:#2d3748;color:#fff}
.nav .active{background:#4299e1;color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#fff;padding:14px 16px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat-num{font-size:26px;font-weight:800;color:#2d3748}
.stat-label{color:#718096;font-size:11px;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.filter-btn{padding:6px 14px;font-size:12px;font-weight:600;border:2px solid #e2e8f0;border-radius:20px;background:#fff;cursor:pointer;transition:all .15s;color:#4a5568}
.filter-btn:hover{border-color:#4299e1;color:#2b6cb0}
.filter-btn.active{background:#4299e1;border-color:#4299e1;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-bottom:32px}
.card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:all .2s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-2px)}
.card.done{opacity:.45;filter:grayscale(30%)}
.card.off-base{border:2px solid #f6ad55;opacity:.55}
.card.bad-link{border:2px solid #fc8181}
.card-head{margin-bottom:10px}
.company-name{font-size:15px;font-weight:700;line-height:1.3}
.company-meta{font-size:11px;color:#718096;margin-top:3px}
.company-hq{font-size:12px;font-weight:600;color:#4299e1;margin-top:4px}
.stage-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-top:8px;white-space:nowrap}
.pill-new{background:#bee3f8;color:#2c5282}
.pill-followed{background:#c6f6d5;color:#22543d}
.pill-off_base{background:#feebc8;color:#7b341e}
.pill-bad_link{background:#fed7d7;color:#c53030}
.pill-skipped{background:#e2e8f0;color:#4a5568}
.angle-block{margin:12px 0 8px;padding:10px 12px;background:#f7fafc;border-left:3px solid #4299e1;border-radius:0 6px 6px 0;font-size:12px;color:#2d3748;line-height:1.6;flex:1}
.strategy-block{padding:8px 12px;background:#f0fff4;border-left:3px solid #68d391;border-radius:0 6px 6px 0;font-size:11px;color:#276749;line-height:1.5;margin-bottom:12px}
.strategy-label{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;color:#276749}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.btn{padding:8px 12px;font-size:12px;border:none;border-radius:6px;cursor:pointer;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-linkedin{background:#0a66c2;color:#fff;flex:1}
.btn-linkedin:hover{background:#004182}
.btn-followed{background:#38a169;color:#fff;flex:1}
.btn-followed:hover{background:#276749}
.btn-skip{background:#edf2f7;color:#4a5568}
.btn-skip:hover{background:#e2e8f0}
.btn-offbase{background:#fff;color:#c05621;border:1px solid #f6ad55;font-size:11px}
.btn-offbase:hover{background:#fffaf0}
.btn-badlink{background:#fff;color:#c53030;border:1px solid #fc8181;font-size:11px}
.btn-badlink:hover{background:#fff5f5}
.btn-undo{background:#fff;color:#718096;border:1px solid #cbd5e0;font-size:11px}
.btn-undo:hover{background:#f7fafc}
.loading{text-align:center;padding:60px;color:#718096;font-size:15px}
.empty{text-align:center;padding:40px;color:#a0aec0;font-size:14px}
footer{text-align:center;padding:24px;color:#a0aec0;font-size:12px;border-top:1px solid #e2e8f0;margin-top:8px}
.last-updated{font-size:11px;color:#a0aec0;margin-left:auto}
</style>
</head>
<body>
<header>
  <div>
    <h1>🏢 Company Follow</h1>
    <div class="sub">CrewCast Sales · Company Portal</div>
  </div>
  <div class="nav">
    <a href="index.html">Prospects</a>
    <a href="companies.html" class="active">Companies</a>
  </div>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-total">—</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" id="s-new">—</div><div class="stat-label">Need Follow</div></div>
    <div class="stat"><div class="stat-num" id="s-followed">—</div><div class="stat-label">Followed</div></div>
    <div class="stat"><div class="stat-num" id="s-offbase">—</div><div class="stat-label">Off Base</div></div>
    <div class="stat"><div class="stat-num" id="s-badlink">—</div><div class="stat-label">Bad Links</div></div>
    <div class="stat"><div class="stat-num" id="s-skipped">—</div><div class="stat-label">Skipped</div></div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('NEW', this)">Need Follow</button>
    <button class="filter-btn" onclick="setFilter('FOLLOWED', this)">Followed</button>
    <button class="filter-btn" onclick="setFilter('SKIPPED', this)">Skipped</button>
    <button class="filter-btn" onclick="setFilter('OFF_BASE', this)">Off Base</button>
    <button class="filter-btn" onclick="setFilter('BAD_LINK', this)">Bad Links</button>
    <span class="last-updated" id="last-updated"></span>
  </div>

  <div class="grid" id="cards">
    <div class="loading">⏳ Loading companies...</div>
  </div>
</div>

<footer>CrewCast Sales · Daily Outreach Portal · <a href="index.html" style="color:#4299e1">← Back to Prospects</a></footer>

<script>
const API = 'https://superagent-39294123.base44.app/functions';
let allCompanies = [];
let currentFilter = 'all';

// ── STATUS UTILITIES ─────────────────────────────────────────────────────────
function statusLabel(s) {
  const map = { NEW:'Need Follow', FOLLOWED:'Followed', SKIPPED:'Skipped', OFF_BASE:'Off Base', BAD_LINK:'Bad Link' };
  return map[s] || s;
}
function statusPill(s) {
  const cls = { NEW:'pill-new', FOLLOWED:'pill-followed', SKIPPED:'pill-skipped', OFF_BASE:'pill-off_base', BAD_LINK:'pill-bad_link' };
  const icon = { NEW:'🔵', FOLLOWED:'✅', SKIPPED:'⏭️', OFF_BASE:'⚠️', BAD_LINK:'🔴' };
  return `<span class="stage-pill ${cls[s]||'pill-skipped'}">${icon[s]||''} ${statusLabel(s)}</span>`;
}

// ── FETCH FROM BACKEND ───────────────────────────────────────────────────────
async function loadCompanies() {
  try {
    const res = await fetch(`${API}/getCompanyStatuses`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allCompanies = (data.companies || data || []).sort((a, b) => {
      // Sort: NEW first, then others, FOLLOWED/SKIPPED last
      const order = { NEW:0, BAD_LINK:1, OFF_BASE:2, SKIPPED:3, FOLLOWED:4 };
      return (order[a.status]??5) - (order[b.status]??5);
    });
    document.getElementById('last-updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
    render();
  } catch(e) {
    document.getElementById('cards').innerHTML = `<div class="empty">⚠️ Could not load companies: ${e.message}<br><br><button onclick="loadCompanies()" style="padding:8px 16px;background:#4299e1;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600">Retry</button></div>`;
  }
}

// ── UPDATE STATUS ─────────────────────────────────────────────────────────────
async function updateStatus(id, newStatus) {
  try {
    await fetch(`${API}/updateCompanyStatus`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status: newStatus })
    });
    const co = allCompanies.find(c => c.id === id);
    if (co) co.status = newStatus;
    render();
  } catch(e) {
    alert('Update failed: ' + e.message);
  }
}

// ── FILTER ────────────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const counts = { NEW:0, FOLLOWED:0, OFF_BASE:0, BAD_LINK:0, SKIPPED:0 };
  allCompanies.forEach(c => { if (counts[c.status] !== undefined) counts[c.status]++; });
  document.getElementById('s-total').textContent   = allCompanies.length;
  document.getElementById('s-new').textContent     = counts.NEW;
  document.getElementById('s-followed').textContent= counts.FOLLOWED;
  document.getElementById('s-offbase').textContent = counts.OFF_BASE;
  document.getElementById('s-badlink').textContent = counts.BAD_LINK;
  document.getElementById('s-skipped').textContent = counts.SKIPPED;
}

// ── RENDER CARDS ──────────────────────────────────────────────────────────────
function render() {
  updateStats();
  const list = currentFilter === 'all'
    ? allCompanies
    : allCompanies.filter(c => c.status === currentFilter);

  if (list.length === 0) {
    document.getElementById('cards').innerHTML = `<div class="empty">No companies in this category.</div>`;
    return;
  }

  document.getElementById('cards').innerHTML = list.map(c => {
    const isDone    = c.status === 'FOLLOWED';
    const isOff     = c.status === 'OFF_BASE';
    const isBad     = c.status === 'BAD_LINK';
    const isSkipped = c.status === 'SKIPPED';
    const cardClass = isDone ? 'card done' : isOff ? 'card off-base' : isBad ? 'card bad-link' : 'card';

    // Sector icon
    const icon = c.sector?.toLowerCase().includes('electric') ? '⚡'
      : c.sector?.toLowerCase().includes('civil') ? '🏗️'
      : c.sector?.toLowerCase().includes('pipeline') || c.sector?.toLowerCase().includes('utilit') ? '🔧'
      : c.sector?.toLowerCase().includes('concrete') ? '🧱'
      : c.sector?.toLowerCase().includes('renewable') || c.sector?.toLowerCase().includes('energy') ? '☀️'
      : c.sector?.toLowerCase().includes('material') ? '🪨'
      : '🏢';

    // Action buttons
    let actions = '';
    if (c.status === 'NEW') {
      actions = `
        <button class="btn btn-linkedin" onclick="window.open('${c.linkedin_url}','_blank')">🔗 Open LinkedIn</button>
        <button class="btn btn-followed" onclick="updateStatus('${c.id}','FOLLOWED')">✅ Followed</button>
        <button class="btn btn-skip" onclick="updateStatus('${c.id}','SKIPPED')">Skip</button>
        <button class="btn btn-offbase" onclick="updateStatus('${c.id}','OFF_BASE')">⚠️ Off Base</button>
        <button class="btn btn-badlink" onclick="updateStatus('${c.id}','BAD_LINK')">🔴 Bad Link</button>`;
    } else if (c.status === 'FOLLOWED') {
      actions = `
        <button class="btn btn-linkedin" onclick="window.open('${c.linkedin_url}','_blank')">🔗 Open LinkedIn</button>
        <button class="btn btn-undo" onclick="updateStatus('${c.id}','NEW')">↩ Undo</button>`;
    } else if (c.status === 'SKIPPED') {
      actions = `
        <button class="btn btn-followed" onclick="updateStatus('${c.id}','NEW')">↩ Move to Queue</button>`;
    } else if (c.status === 'OFF_BASE') {
      actions = `
        <button class="btn btn-undo" onclick="updateStatus('${c.id}','NEW')">↩ Move Back</button>`;
    } else if (c.status === 'BAD_LINK') {
      actions = `
        <button class="btn btn-linkedin" onclick="window.open('https://www.linkedin.com/search/results/companies/?keywords=${encodeURIComponent(c.company_name)}','_blank')">🔍 Search LinkedIn</button>
        <button class="btn btn-undo" onclick="updateStatus('${c.id}','NEW')">↩ Move Back</button>`;
    }

    return `
    <div class="${cardClass}" id="card-${c.id}">
      <div class="card-head">
        <div class="company-name">${icon} ${c.company_name}</div>
        <div class="company-meta">${c.sector || ''}${c.employee_count ? ' · ' + c.employee_count + ' employees' : ''}${c.revenue_estimate ? ' · ' + c.revenue_estimate : ''}</div>
        <div class="company-hq">📍 ${c.headquarters || '—'}</div>
        ${statusPill(c.status)}
      </div>
      ${c.engagement_angle ? `<div class="angle-block">${c.engagement_angle}</div>` : ''}
      ${c.follow_strategy ? `<div class="strategy-block"><div class="strategy-label">Strategy</div>${c.follow_strategy}</div>` : ''}
      <div class="card-actions">${actions}</div>
    </div>`;
  }).join('');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadCompanies();
// Auto-refresh every 5 minutes
setInterval(loadCompanies, 5 * 60 * 1000);
</script>
</body>
</html>
