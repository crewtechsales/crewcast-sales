<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrewCast — Company Follow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;color:#1a202c}
header{background:#1a202c;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2d3748;position:sticky;top:0;z-index:100}
h1{font-size:18px;font-weight:700;margin:0}
.sub{font-size:12px;color:#a0aec0;margin-top:2px}
.nav{display:flex;gap:12px;align-items:center}
.nav a{color:#a0aec0;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px}
.nav a:hover{background:#2d3748;color:#fff}
.nav .active{background:#4299e1;color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat-num{font-size:22px;font-weight:700;color:#2d3748}
.stat-label{color:#718096;font-size:11px;margin-top:2px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:32px}
.card{background:#fff;border-radius:8px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .2s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-2px)}
.card.skipped{opacity:0.45}
.card.bad-link{border:2px solid #fc8181}
.card.off-base{border:2px solid #f6ad55;opacity:0.5}
.card-head{margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start}
.company-name{font-size:15px;font-weight:700;color:#1a202c}
.company-meta{font-size:11px;color:#718096;margin-top:3px}
.sector-tag{display:inline-block;background:#ebf8ff;color:#2b6cb0;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-top:5px}
.status-badge{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap;margin-left:8px;flex-shrink:0}
.status-badge.new{background:#bee3f8;color:#2c5282}
.status-badge.followed{background:#c6f6d5;color:#22543d}
.status-badge.skipped{background:#e2e8f0;color:#4a5568}
.status-badge.bad-link{background:#fed7d7;color:#c53030}
.status-badge.off-base{background:#feebc8;color:#c05621}
.info-block{margin:10px 0;padding:10px;background:#f7fafc;border-left:3px solid #4299e1;border-radius:0 4px 4px 0;font-size:12px;color:#4a5568;line-height:1.5}
.info-label{font-weight:700;color:#2d3748;font-size:11px;margin-bottom:3px}
.strategy-block{margin:8px 0;padding:10px;background:#f7fafc;border-left:3px solid #9f7aea;border-radius:0 4px 4px 0;font-size:12px;color:#4a5568;line-height:1.5}
.card-actions{display:flex;gap:6px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.btn{padding:7px 10px;font-size:11px;border:none;border-radius:4px;cursor:pointer;transition:all .2s;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-copy{background:#4299e1;color:#fff;flex:1}
.btn-copy:hover:not(:disabled){background:#3182ce}
.btn-copy.copied{background:#48bb78}
.btn-linkedin{background:#0a66c2;color:#fff}
.btn-linkedin:hover:not(:disabled){background:#055199}
.btn-linkedin.bad{background:#fc8181;color:#fff}
.btn-followed{background:#48bb78;color:#fff}
.btn-followed:hover:not(:disabled){background:#38a169}
.btn-followed.done{background:#276749}
.btn-skip{background:#e2e8f0;color:#4a5568}
.btn-skip:hover:not(:disabled){background:#cbd5e0}
.btn-offbase{background:#fff;color:#c05621;border:1px solid #f6ad55}
.btn-offbase:hover:not(:disabled){background:#feebc8}
.btn-offbase.flagged{background:#feebc8;color:#7b341e;border-color:#ed8936;cursor:not-allowed}
.btn-badlink{background:#fff;color:#c53030;border:1px solid #fc8181;font-size:10px}
.btn-badlink:hover:not(:disabled){background:#fff5f5}
.btn-badlink.flagged{background:#fff5f5;color:#9b2c2c;cursor:not-allowed}
.error-msg{background:#fed7d7;color:#c53030;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px}
.loading{text-align:center;padding:60px;color:#718096;font-size:14px;grid-column:1/-1}
footer{text-align:center;padding:24px;color:#718096;font-size:12px;border-top:1px solid #e2e8f0;margin-top:16px}
</style>

let statuses = {};

async function loadStatuses() {
  try {
    const res = await fetch(`${API_BASE}/getCompanyStatuses`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({})
    });
    if (res.ok) {
      const data = await res.json();
      statuses = data.statuses || {};
    }
  } catch(e) { /* fallback: all NEW */ }
  renderCards();
}

async function updateStatus(id, status) {
  try {
    const res = await fetch(`${API_BASE}/updateCompanyStatus`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id, status })
    });
    if (!res.ok) throw new Error('Server error');
    statuses[id] = status;
    return true;
  } catch(e) {
    showError('Could not save status. Check your connection and try again.');
    return false;
  }
}

function showError(msg) {
  const el = document.getElementById('error-container');
  el.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}

function renderCards() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  let followed = 0, skipped = 0, offbase = 0, badlinks = 0;

  COMPANIES.forEach(c => {
    const status = (statuses[c.id] || 'NEW').toUpperCase();
    if (status === 'FOLLOWED') followed++;
    if (status === 'SKIPPED') skipped++;
    if (status === 'OFF_BASE') offbase++;
    if (status === 'BAD_LINK') badlinks++;

    const badgeMap = {
      'NEW': 'status-badge new',
      'FOLLOWED': 'status-badge followed',
      'SKIPPED': 'status-badge skipped',
      'OFF_BASE': 'status-badge off-base',
      'BAD_LINK': 'status-badge bad-link'
    };
    const badgeTextMap = {
      'NEW': 'NEW',
      'FOLLOWED': 'FOLLOWED',
      'SKIPPED': 'SKIPPED',
      'OFF_BASE': '🚫 OFF BASE',
      'BAD_LINK': '⚠ BAD LINK'
    };
    const cardClassMap = {
      'NEW': 'card',
      'FOLLOWED': 'card',
      'SKIPPED': 'card skipped',
      'OFF_BASE': 'card off-base',
      'BAD_LINK': 'card bad-link'
    };

    const isActioned = ['FOLLOWED','SKIPPED','OFF_BASE','BAD_LINK'].includes(status);
    const isOffBase = status === 'OFF_BASE';
    const isBadLink = status === 'BAD_LINK';
    const isFollowed = status === 'FOLLOWED';

    container.innerHTML += `
    <div class="${cardClassMap[status] || 'card'}" id="card-${c.id}">
      <div class="card-head">
        <div style="flex:1;min-width:0">
          <div class="company-name">${c.company_name}</div>
          <div class="company-meta">${c.headquarters} · ${c.employee_count} employees · ${c.revenue_estimate}</div>
          <span class="sector-tag">${c.sector}</span>
        </div>
        <div class="${badgeMap[status] || 'status-badge new'}" id="badge-${c.id}">${badgeTextMap[status] || 'NEW'}</div>
      </div>
      <div class="info-block">
        <div class="info-label">Engagement Angle</div>
        ${c.engagement_angle}
      </div>
      <div class="strategy-block">
        <div class="info-label" style="color:#553c9a">Follow Strategy</div>
        ${c.follow_strategy}
      </div>
      <div class="card-actions">
        <button class="btn btn-copy" onclick="copyText('${c.engagement_angle.replace(/'/g,"\\'")}', this)">📋 Copy</button>
        <a class="btn btn-linkedin${isBadLink ? ' bad' : ''}" id="linkedin-${c.id}" href="${c.linkedin_url}" target="_blank">${isBadLink ? '⚠ Bad Link' : '→ LinkedIn'}</a>
        <button class="btn btn-followed${isFollowed ? ' done' : ''}" id="followed-${c.id}" onclick="doFollow('${c.id}')" ${isActioned ? 'disabled' : ''}>✓ Followed</button>
        <button class="btn btn-skip" id="skip-${c.id}" onclick="doSkip('${c.id}')" ${isActioned ? 'disabled' : ''}>Skip</button>
        <button class="btn btn-offbase${isOffBase ? ' flagged' : ''}" id="offbase-${c.id}" onclick="doOffBase('${c.id}')" ${isOffBase ? 'disabled' : ''}>🚫 ${isOffBase ? 'Off Base' : 'Off Base'}</button>
        <button class="btn btn-badlink${isBadLink ? ' flagged' : ''}" id="badlink-${c.id}" onclick="doBadLink('${c.id}')" ${isBadLink ? 'disabled' : ''}>🚩 ${isBadLink ? 'Flagged' : 'Bad Link'}</button>
      </div>
    </div>`;
  });

  const total = COMPANIES.length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-followed').textContent = followed;
  document.getElementById('stat-unsent').textContent = total - followed - skipped - offbase - badlinks;
  document.getElementById('stat-offbase').textContent = offbase;
  document.getElementById('stat-badlink').textContent = badlinks;
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

async function doFollow(id) {
  const btn = document.getElementById(`followed-${id}`);
  btn.textContent = 'Saving...'; btn.disabled = true;
  const ok = await updateStatus(id, 'FOLLOWED');
  if (ok) {
    document.getElementById(`badge-${id}`).className = 'status-badge followed';
    document.getElementById(`badge-${id}`).textContent = 'FOLLOWED';
    document.getElementById(`skip-${id}`).disabled = true;
    document.getElementById(`offbase-${id}`).disabled = true;
    document.getElementById(`badlink-${id}`).disabled = true;
    btn.textContent = '✓ Followed'; btn.classList.add('done');
    updateStatCounts();
  } else { btn.textContent = '✓ Followed'; btn.disabled = false; }
}

async function doSkip(id) {
  const btn = document.getElementById(`skip-${id}`);
  btn.textContent = 'Saving...'; btn.disabled = true;
  const ok = await updateStatus(id, 'SKIPPED');
  if (ok) {
    document.getElementById(`badge-${id}`).className = 'status-badge skipped';
    document.getElementById(`badge-${id}`).textContent = 'SKIPPED';
    document.getElementById(`card-${id}`).classList.add('skipped');
    document.getElementById(`followed-${id}`).disabled = true;
    document.getElementById(`offbase-${id}`).disabled = true;
    document.getElementById(`badlink-${id}`).disabled = true;
    updateStatCounts();
  } else { btn.textContent = 'Skip'; btn.disabled = false; }
}

async function doOffBase(id) {
  const btn = document.getElementById(`offbase-${id}`);
  btn.textContent = 'Saving...'; btn.disabled = true;
  const ok = await updateStatus(id, 'OFF_BASE');
  if (ok) {
    document.getElementById(`badge-${id}`).className = 'status-badge off-base';
    document.getElementById(`badge-${id}`).textContent = '🚫 OFF BASE';
    document.getElementById(`card-${id}`).classList.add('off-base');
    document.getElementById(`followed-${id}`).disabled = true;
    document.getElementById(`skip-${id}`).disabled = true;
    document.getElementById(`badlink-${id}`).disabled = true;
    btn.textContent = '🚫 Off Base'; btn.classList.add('flagged');
    updateStatCounts();
  } else { btn.textContent = '🚫 Off Base'; btn.disabled = false; }
}

async function doBadLink(id) {
  const btn = document.getElementById(`badlink-${id}`);
  btn.textContent = 'Saving...'; btn.disabled = true;
  const ok = await updateStatus(id, 'BAD_LINK');
  if (ok) {
    document.getElementById(`badge-${id}`).className = 'status-badge bad-link';
    document.getElementById(`badge-${id}`).textContent = '⚠ BAD LINK';
    document.getElementById(`card-${id}`).classList.add('bad-link');
    const lnBtn = document.getElementById(`linkedin-${id}`);
    if (lnBtn) { lnBtn.classList.add('bad'); lnBtn.textContent = '⚠ Bad Link'; }
    document.getElementById(`followed-${id}`).disabled = true;
    document.getElementById(`skip-${id}`).disabled = true;
    document.getElementById(`offbase-${id}`).disabled = true;
    btn.textContent = '🚩 Flagged'; btn.classList.add('flagged');
    updateStatCounts();
  } else { btn.textContent = '🚩 Bad Link'; btn.disabled = false; }
}

function updateStatCounts() {
  let followed = 0, skipped = 0, offbase = 0, badlinks = 0;
  COMPANIES.forEach(c => {
    const s = (statuses[c.id] || 'NEW').toUpperCase();
    if (s === 'FOLLOWED') followed++;
    if (s === 'SKIPPED') skipped++;
    if (s === 'OFF_BASE') offbase++;
    if (s === 'BAD_LINK') badlinks++;
  });
  const total = COMPANIES.length;
  document.getElementById('stat-followed').textContent = followed;
  document.getElementById('stat-unsent').textContent = total - followed - skipped - offbase - badlinks;
  document.getElementById('stat-offbase').textContent = offbase;
  document.getElementById('stat-badlink').textContent = badlinks;
}

loadStatuses();
</script>
