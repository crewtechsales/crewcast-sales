<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrewCast — Individual Outreach</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;color:#1a202c}
header{background:#1a202c;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2d3748;position:sticky;top:0;z-index:100}
h1{font-size:18px;font-weight:700;margin:0}
.sub{font-size:12px;color:#a0aec0;margin-top:2px}
.nav{display:flex;gap:12px;align-items:center}
.nav a{color:#a0aec0;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px}
.nav a:hover{background:#2d3748;color:#fff}
.nav .active{background:#4299e1;color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat-num{font-size:22px;font-weight:700;color:#2d3748}
.stat-label{color:#718096;font-size:11px;margin-top:2px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:32px}
.card{background:#fff;border-radius:8px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .2s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-2px)}
.card.skipped{opacity:0.45}
.card.off-base{border:2px solid #f6ad55;opacity:0.5}
.card.bad-link{border:2px solid #fc8181}
.card-head{margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start}
.prospect-name{font-size:15px;font-weight:700;color:#1a202c}
.prospect-title{font-size:11px;color:#718096;margin-top:2px}
.prospect-company{font-size:12px;font-weight:600;color:#4299e1;margin-top:4px}
.status-badge{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap;margin-left:8px;flex-shrink:0}
.status-badge.new{background:#bee3f8;color:#2c5282}
.status-badge.sent{background:#c6f6d5;color:#22543d}
.status-badge.skipped{background:#e2e8f0;color:#4a5568}
.status-badge.off-base{background:#feebc8;color:#c05621}
.status-badge.bad-link{background:#fed7d7;color:#c53030}
.touch-block{margin:8px 0;padding:10px;background:#f7fafc;border-left:3px solid #4299e1;border-radius:0 4px 4px 0;font-size:12px;color:#4a5568;line-height:1.5}
.touch-block.t2{border-left-color:#9f7aea}
.touch-block.t3{border-left-color:#ed8936}
.touch-label{font-weight:700;color:#2d3748;font-size:11px;margin-bottom:3px}
.touch-label.t2{color:#553c9a}
.touch-label.t3{color:#7b341e}
.card-actions{display:flex;gap:6px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.btn{padding:7px 10px;font-size:11px;border:none;border-radius:4px;cursor:pointer;transition:all .2s;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-copy{background:#4299e1;color:#fff;flex:1}
.btn-copy:hover:not(:disabled){background:#3182ce}
.btn-copy.copied{background:#48bb78}
.btn-linkedin{background:#0a66c2;color:#fff}
.btn-linkedin:hover:not(:disabled){background:#055199}
.btn-linkedin.bad{background:#fc8181}
.btn-sent{background:#48bb78;color:#fff}
.btn-sent:hover:not(:disabled){background:#38a169}
.btn-sent.done{background:#276749}
.btn-skip{background:#e2e8f0;color:#4a5568}
.btn-skip:hover:not(:disabled){background:#cbd5e0}
.btn-offbase{background:#fff;color:#c05621;border:1px solid #f6ad55}
.btn-offbase:hover:not(:disabled){background:#feebc8}
.btn-offbase.flagged{background:#feebc8;color:#7b341e;border-color:#ed8936;cursor:not-allowed}
.btn-badlink{background:#fff;color:#c53030;border:1px solid #fc8181;font-size:10px}
.btn-badlink:hover:not(:disabled){background:#fff5f5}
.btn-badlink.flagged{background:#fff5f5;color:#9b2c2c;cursor:not-allowed}
.error-msg{background:#fed7d7;color:#c53030;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px}
.loading{text-align:center;padding:60px;color:#718096;font-size:14px;grid-column:1/-1}
footer{text-align:center;padding:24px;color:#718096;font-size:12px;border-top:1px solid #e2e8f0;margin-top:16px}
</style>
</head>
<body>
<header>
  <div><h1>🏗️ Individual Outreach</h1><div class="sub">CrewCast Sales · Research Portal</div></div>
  <div class="nav">
    <a href="index.html" class="active">Prospects</a>
    <a href="companies.html">Companies</a>
  </div>
</header>
<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Prospects</div></div>
    <div class="stat"><div class="stat-num" id="stat-sent">—</div><div class="stat-label">Sent</div></div>
    <div class="stat"><div class="stat-num" id="stat-unsent">—</div><div class="stat-label">Unsent</div></div>
    <div class="stat"><div class="stat-num" id="stat-offbase">—</div><div class="stat-label">Off Base</div></div>
    <div class="stat"><div class="stat-num" id="stat-badlink">—</div><div class="stat-label">Bad Links</div></div>
  </div>
  <div id="error-container"></div>
  <div class="grid" id="cards-container">
    <div class="loading">Loading prospects...</div>
  </div>
</div>
<footer>CrewCast Sales · Daily Outreach Portal · <a href="companies.html" style="color:#4299e1">Company Follow →</a></footer>

<script>
const API_BASE = 'https://superagent-39294123.base44.app/functions';

const PROSPECTS = [
  {
    hubspot_id: '501104648944',
    name: 'Michael Chen',
    title: 'VP of Operations',
    company: 'Sunbelt Construction Group',
    linkedin_url: 'https://www.linkedin.com/in/michael-chen-vp-ops',
    touch1: "Michael, saw Sunbelt's expansion into commercial renovations. Crew scheduling at scale is tough. Worth 15 min to chat?",
    touch2: "Michael, following up — CrewCast helps ops teams forecast labor weeks ahead. Happy to show you a quick demo.",
    touch3: "Michael, last note — if crew predictability is on your radar at Sunbelt, I'd love to connect. No pressure."
  },
  {
    hubspot_id: '501104648945',
    name: 'Patricia Williams',
    title: 'SVP Operations',
    company: 'Turner Construction Company',
    linkedin_url: 'https://www.linkedin.com/in/patricia-williams-turner',
    touch1: "Patricia, Turner's growth in healthcare infra is impressive. Staffing your teams efficiently at that scale matters. Chat?",
    touch2: "Patricia, wanted to follow up — CrewCast helps SVPs like you get ahead of labor gaps before they hit schedules.",
    touch3: "Patricia, one last reach — workforce forecasting for Turner's scale could be a real differentiator. Interested?"
  },
  {
    hubspot_id: '501131574009',
    name: 'James Rodriguez',
    title: 'Director of Operations',
    company: 'Helix Electric',
    linkedin_url: 'https://www.linkedin.com/in/james-rodriguez-helix',
    touch1: "James, Helix's specialization in data center wiring is growing fast. Staffing accuracy there pays off. Interested?",
    touch2: "James, following up — CrewCast forecasts crew needs by trade and project phase. Could save Helix real time.",
    touch3: "James, last touch — if labor planning for data center projects is a pain point, I'd love to show you CrewCast."
  },
  {
    hubspot_id: '501177976521',
    name: 'Sarah Thompson',
    title: 'COO',
    company: 'Precision Civil Engineering',
    linkedin_url: 'https://www.linkedin.com/in/sarah-thompson-coo',
    touch1: "Sarah, infrastructure projects need predictable crews. Precision's reputation depends on execution. 15 min call?",
    touch2: "Sarah, following up — CrewCast helps civil COOs forecast labor demand and avoid last-minute scrambles.",
    touch3: "Sarah, final note — if crew predictability matters at Precision Civil, happy to do a quick demo. No obligation."
  },
  {
    hubspot_id: '501105388261',
    name: 'David Martinez',
    title: 'VP Operations',
    company: 'Boral Construction Services',
    linkedin_url: 'https://www.linkedin.com/in/david-martinez-boral',
    touch1: "David, Boral's concrete focus is a niche win. Crew scheduling in concrete is tight. Worth discussing?",
    touch2: "David, wanted to follow up — CrewCast is built for specialty contractors like Boral. Happy to walk you through it.",
    touch3: "David, last outreach — if concrete crew scheduling is a challenge, CrewCast could be the fix. Interested?"
  },
  {
    hubspot_id: '501104394947',
    name: 'Lisa Anderson',
    title: 'Senior Superintendent',
    company: 'Consigli Construction',
    linkedin_url: 'https://www.linkedin.com/in/lisa-anderson-consigli',
    touch1: "Lisa, Consigli's focus on institutional buildings means tight schedules. Crew planning is critical. Chat?",
    touch2: "Lisa, following up — superintendents using CrewCast cut reactive hiring by forecasting 3-4 weeks out.",
    touch3: "Lisa, last note — if managing crews across Consigli's institutional projects is complex, I'd love to connect."
  },
  {
    hubspot_id: '501131695865',
    name: 'Robert Kim',
    title: 'Director of Project Controls',
    company: 'Westfield Construction',
    linkedin_url: 'https://www.linkedin.com/in/robert-kim-controls',
    touch1: "Robert, project controls live and die by crew predictability. Westfield's scale makes this key. Interested?",
    touch2: "Robert, following up — CrewCast integrates with project controls workflows to give you labor visibility weeks out.",
    touch3: "Robert, final reach — if crew forecast accuracy is a gap at Westfield, CrewCast solves it. Worth a look?"
  },
  {
    hubspot_id: '501080315581',
    name: 'Jennifer Hayes',
    title: 'VP of Operations',
    company: 'Midwest Electrical Contractors',
    linkedin_url: 'https://www.linkedin.com/in/jennifer-hayes-midwest',
    touch1: "Jennifer, Midwest's growth in commercial electrical is strong. Crew scaling is your next lever. Talk?",
    touch2: "Jennifer, following up — CrewCast helps electrical VPs forecast journeyman and apprentice needs by project.",
    touch3: "Jennifer, last touch — if scaling crews across commercial electrical is a challenge, happy to show CrewCast."
  },
  {
    hubspot_id: '501098431187',
    name: 'Christopher Brooks',
    title: 'SVP Operations',
    company: 'Sterling Civil Engineering',
    linkedin_url: 'https://www.linkedin.com/in/christopher-brooks-sterling',
    touch1: "Christopher, civil infrastructure projects need precise crew forecasts. Sterling's backlog is impressive. Interested?",
    touch2: "Christopher, following up — CrewCast gives civil SVPs visibility into labor capacity before contract awards.",
    touch3: "Christopher, final note — if forecasting crews for Sterling's growing backlog is a challenge, I'd love to connect."
  },
  {
    hubspot_id: '501139027646',
    name: 'Amanda Foster',
    title: 'COO',
    company: 'Cornerstone General Contractors',
    linkedin_url: 'https://www.linkedin.com/in/amanda-foster-cornerstone',
    touch1: "Amanda, Cornerstone's size means labor planning complexity. Forecasting drives execution. 15 min?",
    touch2: "Amanda, following up — CrewCast helps GC COOs manage labor across multiple concurrent projects in real time.",
    touch3: "Amanda, last reach — workforce forecasting at Cornerstone's scale is a real edge. Happy to show you CrewCast."
  }
];

let statuses = {};

async function loadStatuses() {
  try {
    const res = await fetch(`${API_BASE}/getProspectStatuses`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({})
    });
    if (res.ok) {
      const data = await res.json();
      statuses = data.statuses || {};
    }
  } catch(e) { /* fallback: all NEW */ }
  renderCards();
}

async function updateStatus(hubspot_id, status) {
  try {
    const res = await fetch(`${API_BASE}/updateProspectStatus`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ hubspot_id, status })
    });
    if (!res.ok) throw new Error('Server error');
    statuses[hubspot_id] = status;
    return true;
  } catch(e) {
    showError('Could not save status. Check your connection and try again.');
    return false;
  }
}

function showError(msg) {
  const el = document.getElementById('error-container');
  el.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}

function renderCards() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  let sent = 0, skipped = 0, offbase = 0, badlinks = 0;

  PROSPECTS.forEach(p => {
    const status = (statuses[p.hubspot_id] || 'NEW').toUpperCase();
    if (status === 'SENT') sent++;
    if (status === 'SKIPPED') skipped++;
    if (status === 'OFF_BASE') offbase++;
    if (status === 'BAD_LINK') badlinks++;

    const badgeMap = {
      'NEW': 'status-badge new', 'SENT': 'status-badge sent',
      'SKIPPED': 'status-badge skipped', 'OFF_BASE': 'status-badge off-base',
      'BAD_LINK': 'status-badge bad-link'
    };
    const badgeTextMap = {
      'NEW': 'NEW', 'SENT': 'SENT', 'SKIPPED': 'SKIPPED',
      'OFF_BASE': '🚫 OFF BASE', 'BAD_LINK': '⚠ BAD LINK'
    };
    const cardClassMap = {
      'NEW': 'card', 'SENT': 'card', 'SKIPPED': 'card skipped',
      'OFF_BASE': 'card off-base', 'BAD_LINK': 'card bad-link'
    };

    const isActioned = ['SENT','SKIPPED','OFF_BASE','BAD_LINK'].includes(status);
    const isSent = status === 'SENT';
    const isOffBase = status === 'OFF_BASE';
    const isBadLink = status === 'BAD_LINK';

    container.innerHTML += `
    <div class="${cardClassMap[status] || 'card'}" id="card-${p.hubspot_id}">
      <div class="card-head">
        <div style="flex:1;min-width:0">
          <div class="prospect-name">${p.name}</div>
          <div class="prospect-title">${p.title}</div>
          <div class="prospect-company">${p.company}</div>
        </div>
        <div class="${badgeMap[status] || 'status-badge new'}" id="badge-${p.hubspot_id}">${badgeTextMap[status] || 'NEW'}</div>
      </div>
      <div class="touch-block">
        <div class="touch-label">Touch 1 · Connection Request</div>
        <div>${p.touch1}</div>
      </div>
      <div class="touch-block t2">
        <div class="touch-label t2">Touch 2 · Value Message</div>
        <div>${p.touch2}</div>
      </div>
      <div class="touch-block t3">
        <div class="touch-label t3">Touch 3 · Follow-up</div>
        <div>${p.touch3}</div>
      </div>
      <div class="card-actions">
        <button class="btn btn-copy" onclick="copyText('${p.touch1.replace(/'/g,"\\'")}', this)">📋 Copy T1</button>
        <a class="btn btn-linkedin${isBadLink ? ' bad' : ''}" id="linkedin-${p.hubspot_id}" href="${p.linkedin_url}" target="_blank">${isBadLink ? '⚠ Bad Link' : '→ LinkedIn'}</a>
        <button class="btn btn-sent${isSent ? ' done' : ''}" id="sent-${p.hubspot_id}" onclick="doSent('${p.hubspot_id}')" ${isActioned ? 'disabled' : ''}>✓ Sent</button>
        <button class="btn btn-skip" id="skip-${p.hubspot_id}" onclick="doSkip('${p.hubspot_id}')" ${isActioned ? 'disabled' : ''}>Skip</button>
        <button class="btn btn-offbase${isOffBase ? ' flagged' : ''}" id="offbase-${p.hubspot_id}" onclick="doOffBase('${p.hubspot_id}')" ${isOffBase ? 'disabled' : ''}>🚫 ${isOffBase ? 'Off Base' : 'Off Base'}</button>
        <button class="btn btn-badlink${isBadLink ? ' flagged' : ''}" id="badlink-${p.hubspot_id}" onclick="doBadLink('${p.hubspot_id}')" ${isBadLink ? 'disabled' : ''}>🚩 ${isBadLink ? 'Flagged' : 'Bad Link'}</button>
      </div>
    </div>`;
  });

  const total = PROSPECTS.length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-sent').textContent = sent;
  document.getElementById('stat-unsent').textContent = total - sent - skipped - offbase - badlinks;
  document.getElementById('stat-offbase').textContent = offbase;
  document.getElementById('stat-badlink').textContent = badlinks;
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy T1'; btn.classList.remove('copied'); }, 2000);
  });
}

async function doSent(id) {
  const btn = document.getElementById(`sent-${id}`);
  btn.textContent = 'Saving...'; btn.disabled = true;
  const ok = await updateStatus(id, 'SENT');
  if (ok) {
    document.getElementById(`badge-${id}`).className = 'status-badge sent';
    document.getElementById(`badge-${id}`).textContent = 'SENT';
    ['skip','offbase','badlink'].forEach(b => document.getElementById(`${b}-${id}`).disabled = true);
    btn.textContent = '✓ Sent'; btn.classList.add('done');
    updateStatCounts();
  } else { btn.textContent = '✓ Sent'; btn.disabled = false; }
}

async function doSkip(id) {
  const btn = document.getElementById(`skip-${id}`);
  btn.textContent = 'Saving...'; btn.disabled = true;
  const ok = await updateStatus(id, 'SKIPPED');
  if (ok) {
    document.getElementById(`badge-${id}`).className = 'status-badge skipped';
    document.getElementById(`badge-${id}`).textContent = 'SKIPPED';
    document.getElementById(`card-${id}`).classList.add('skipped');
    ['sent','offbase','badlink'].forEach(b => document.getElementById(`${b}-${id}`).disabled = true);
    updateStatCounts();
  } else { btn.textContent = 'Skip'; btn.disabled = false; }
}

async function doOffBase(id) {
  const btn = document.getElementById(`offbase-${id}`);
  btn.textContent = 'Saving...'; btn.disabled = true;
  const ok = await updateStatus(id, 'OFF_BASE');
  if (ok) {
    document.getElementById(`badge-${id}`).className = 'status-badge off-base';
    document.getElementById(`badge-${id}`).textContent = '🚫 OFF BASE';
    document.getElementById(`card-${id}`).classList.add('off-base');
    ['sent','skip','badlink'].forEach(b => document.getElementById(`${b}-${id}`).disabled = true);
    btn.textContent = '🚫 Off Base'; btn.classList.add('flagged');
    updateStatCounts();
  } else { btn.textContent = '🚫 Off Base'; btn.disabled = false; }
}

async function doBadLink(id) {
  const btn = document.getElementById(`badlink-${id}`);
  btn.textContent = 'Saving...'; btn.disabled = true;
  const ok = await updateStatus(id, 'BAD_LINK');
  if (ok) {
    document.getElementById(`badge-${id}`).className = 'status-badge bad-link';
    document.getElementById(`badge-${id}`).textContent = '⚠ BAD LINK';
    document.getElementById(`card-${id}`).classList.add('bad-link');
    const lnBtn = document.getElementById(`linkedin-${id}`);
    if (lnBtn) { lnBtn.classList.add('bad'); lnBtn.textContent = '⚠ Bad Link'; }
    ['sent','skip','offbase'].forEach(b => document.getElementById(`${b}-${id}`).disabled = true);
    btn.textContent = '🚩 Flagged'; btn.classList.add('flagged');
    updateStatCounts();
  } else { btn.textContent = '🚩 Bad Link'; btn.disabled = false; }
}

function updateStatCounts() {
  let sent = 0, skipped = 0, offbase = 0, badlinks = 0;
  PROSPECTS.forEach(p => {
    const s = (statuses[p.hubspot_id] || 'NEW').toUpperCase();
    if (s === 'SENT') sent++;
    if (s === 'SKIPPED') skipped++;
    if (s === 'OFF_BASE') offbase++;
    if (s === 'BAD_LINK') badlinks++;
  });
  const total = PROSPECTS.length;
  document.getElementById('stat-sent').textContent = sent;
  document.getElementById('stat-unsent').textContent = total - sent - skipped - offbase - badlinks;
  document.getElementById('stat-offbase').textContent = offbase;
  document.getElementById('stat-badlink').textContent = badlinks;
}

loadStatuses();
</script>
</body>
</html>
