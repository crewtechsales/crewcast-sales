function daysSince(dateStr) {
  if (!dateStr) return null;
  const diff = Date.now() - new Date(dateStr).getTime();
  return Math.floor(diff / 86400000);
}

function getStage(hid) {
  const r = statusMap[hid] || {};
  const s = r.status || 'NEW';
  if (s === 'OFF_BASE') return { code: 'off-base', label: '🚫 Off Base' };
  if (s === 'BAD_LINK') return { code: 'bad-link', label: '🚩 Bad Link' };
  if (s === 'SKIPPED')  return { code: 'skipped',  label: 'Skipped' };
  if (s === 'SENT_T3')  return { code: 'complete',  label: '✅ Complete' };

  if (s === 'SENT_T2') {
    const days = daysSince(r.t2_sent_date);
    if (days === null || days < T3_WAIT) {
      const left = T3_WAIT - (days || 0);
      return { code: 't3-waiting', label: `⏳ T3 in ${left}d`, touch: 3, waiting: true, daysLeft: left };
    }
    return { code: 't3-ready', label: '🟠 Send T3', touch: 3, waiting: false };
  }

  if (s === 'SENT_T1') {
    const days = daysSince(r.t1_sent_date);
    if (days === null || days < T2_WAIT) {
      const left = T2_WAIT - (days || 0);
      return { code: 't2-waiting', label: `⏳ T2 in ${left}d`, touch: 2, waiting: true, daysLeft: left };
    }
    return { code: 't2-ready', label: '🟣 Send T2', touch: 2, waiting: false };
  }

  // NEW or unrecognized
  return { code: 't1-ready', label: '🔵 Send T1', touch: 1, waiting: false };
}

function updateStats() {
  const total = PROSPECTS.length;
  let t1 = 0, t2ready = 0, t3ready = 0, done = 0;
  PROSPECTS.forEach(p => {
    const st = getStage(p.hubspot_id);
    if (st.code === 't1-ready') t1++;
    else if (st.code === 't2-ready') t2ready++;
    else if (st.code === 't3-ready') t3ready++;
    else if (st.code === 'complete') done++;
  });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-t1').textContent = t1;
  document.getElementById('s-t2ready').textContent = t2ready;
  document.getElementById('s-t3ready').textContent = t3ready;
  document.getElementById('s-done').textContent = done;
}

const pMap = {};
PROSPECTS.forEach(p => pMap[p.hubspot_id] = p);

function renderCard(p) {
  const st = getStage(p.hubspot_id);
  const card = document.createElement('div');
  card.id = 'card-' + p.hubspot_id;

  const fadeClass = ['complete','off-base','bad-link','skipped'].includes(st.code) ? 'done' : '';
  const borderClass = st.code === 'off-base' ? 'off-base' : st.code === 'bad-link' ? 'bad-link' : '';
  card.className = `card ${fadeClass} ${borderClass}`.trim();

  // Determine which touch message to show
  let touchHtml = '';
  if (st.code === 't1-ready') {
    const t1 = p.touch1;
    const over = t1.length > 200;
    touchHtml = `<div class="touch-block">
      <div class="touch-stage-label t1">Touch 1 — Connection Request</div>
      ${t1}
      <div class="char-count ${over ? 'over' : ''}">${t1.length}/200 chars${over ? ' ⚠️ OVER LIMIT' : ' ✓'}</div>
    </div>`;
  } else if (st.code === 't2-ready') {
    touchHtml = `<div class="touch-block t2">
      <div class="touch-stage-label t2">Touch 2 — Value Message</div>
      ${p.touch2}
    </div>`;
  } else if (st.code === 't2-waiting') {
    touchHtml = `<div class="waiting-msg">⏳ T1 sent — T2 unlocks in ${st.daysLeft} day${st.daysLeft !== 1 ? 's' : ''} (${T2_WAIT}-day cadence)</div>`;
  } else if (st.code === 't3-ready') {
    touchHtml = `<div class="touch-block t3">
      <div class="touch-stage-label t3">Touch 3 — Follow-up</div>
      ${p.touch3}
    </div>`;
  } else if (st.code === 't3-waiting') {
    touchHtml = `<div class="waiting-msg">⏳ T2 sent — T3 unlocks in ${st.daysLeft} day${st.daysLeft !== 1 ? 's' : ''} (${T3_WAIT}-day cadence)</div>`;
  } else if (st.code === 'complete') {
    touchHtml = `<div class="waiting-msg" style="background:#c6f6d5;color:#22543d">✅ Full 3-touch sequence complete</div>`;
  } else if (st.code === 'off-base') {
    touchHtml = `<div class="waiting-msg" style="background:#feebc8;color:#c05621">🚫 Flagged as off ICP — excluded from future research</div>`;
  } else if (st.code === 'bad-link') {
    touchHtml = `<div class="waiting-msg" style="background:#fed7d7;color:#c53030">🚩 LinkedIn URL flagged as broken</div>`;
  } else if (st.code === 'skipped') {
    touchHtml = `<div class="waiting-msg" style="background:#e2e8f0;color:#4a5568">⏭️ Skipped</div>`;
  }

  // Action buttons — only show relevant ones per stage
  let actionButtons = '';
  if (st.code === 't1-ready') {
    actionButtons = `
      <button class="btn btn-copy" onclick="copyMsg(this,'${p.hubspot_id}',1)">📋 Copy T1</button>
      <button class="btn btn-linkedin" onclick="openLI('${p.linkedin_url}','${p.hubspot_id}')">🔗 LinkedIn</button>
      <button class="btn btn-sent" onclick="markSent('${p.hubspot_id}','SENT_T1')">✓ T1 Sent</button>`;
  } else if (st.code === 't2-ready') {
    actionButtons = `
      <button class="btn btn-copy" style="background:#9f7aea" onclick="copyMsg(this,'${p.hubspot_id}',2)">📋 Copy T2</button>
      <button class="btn btn-linkedin" onclick="openLI('${p.linkedin_url}','${p.hubspot_id}')">🔗 LinkedIn</button>
      <button class="btn btn-sent" style="background:#9f7aea" onclick="markSent('${p.hubspot_id}','SENT_T2')">✓ T2 Sent</button>`;
  } else if (st.code === 't3-ready') {
    actionButtons = `
      <button class="btn btn-copy" style="background:#ed8936" onclick="copyMsg(this,'${p.hubspot_id}',3)">📋 Copy T3</button>
      <button class="btn btn-linkedin" onclick="openLI('${p.linkedin_url}','${p.hubspot_id}')">🔗 LinkedIn</button>
      <button class="btn btn-sent" style="background:#ed8936" onclick="markSent('${p.hubspot_id}','SENT_T3')">✓ T3 Sent</button>`;
  }

  // Secondary buttons — always show skip/off-base/bad-link unless already actioned
  let secondaryButtons = '';
  const inactive = ['complete','off-base','bad-link','skipped'].includes(st.code);
  if (!inactive) {
    secondaryButtons = `
      <button class="btn btn-skip" onclick="markSent('${p.hubspot_id}','SKIPPED')">Skip</button>
      <button class="btn btn-offbase" onclick="markSent('${p.hubspot_id}','OFF_BASE')">🚫 Off Base</button>
      <button class="btn btn-badlink" onclick="markSent('${p.hubspot_id}','BAD_LINK')">🚩 Bad Link</button>`;
  }

  card.innerHTML = `
    <div class="card-head">
      <div>
        <div class="prospect-name">${p.name}</div>
        <div class="prospect-title">${p.title}</div>
        <div class="prospect-company">${p.company}</div>
      </div>
      <span class="stage-pill ${st.code}">${st.label}</span>
    </div>
    ${touchHtml}
    ${actionButtons ? '<div class="card-actions">' + actionButtons + '</div>' : ''}
    ${secondaryButtons ? '<div class="card-actions" style="margin-top:4px">' + secondaryButtons + '</div>' : ''}
  `;
  return card;
}

function renderAll() {
  const container = document.getElementById('cards');
  container.innerHTML = '';

  // Sort: action-needed first (T1, T2-ready, T3-ready), then waiting, then done
  const order = { 't1-ready':0, 't2-ready':1, 't3-ready':2, 't2-waiting':3, 't3-waiting':4, 'complete':5, 'skipped':6, 'off-base':7, 'bad-link':8 };
  const sorted = [...PROSPECTS].sort((a,b) => (order[getStage(a.hubspot_id).code]||9) - (order[getStage(b.hubspot_id).code]||9));

  sorted.forEach(p => container.appendChild(renderCard(p)));
  updateStats();
}

async function copyMsg(btn, hid, num) {
  const p = pMap[hid];
  const text = num===1 ? p.touch1 : num===2 ? p.touch2 : p.touch3;
  try {
    await navigator.clipboard.writeText(text);
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  } catch(e) { prompt('Copy this:', text); }
}

function openLI(url, hid) {
  if (!url || !url.includes('/in/')) {
    markSent(hid, 'BAD_LINK');
    alert('LinkedIn URL looks invalid — marked as Bad Link.');
    return;
  }
  window.open(url, '_blank');
}

async function markSent(hid, status) {
  if (!statusMap[hid]) statusMap[hid] = {};
  statusMap[hid].status = status;
  const today = new Date().toISOString().split('T')[0];
  if (status === 'SENT_T1') statusMap[hid].t1_sent_date = today;
  if (status === 'SENT_T2') statusMap[hid].t2_sent_date = today;
  if (status === 'SENT_T3') statusMap[hid].t3_sent_date = today;

  // Re-render just this card in place
  const old = document.getElementById('card-' + hid);
  if (old) old.replaceWith(renderCard(pMap[hid]));
  updateStats();

  // Persist to backend
  try {
    await fetch(`${API}/updateProspectStatus`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hubspot_id: hid, status })
    });
  } catch(e) { console.log('Save failed:', e); }
}

(async () => {
  try {
    const r = await fetch(`${API}/getProspectStatuses`, { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const d = await r.json();
    if (d.statuses) d.statuses.forEach(s => { statusMap[s.hubspot_id] = s; });
  } catch(e) { console.log('Load failed:', e); }
  renderAll();
})();
</script>
