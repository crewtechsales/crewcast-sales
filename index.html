<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrewCast — Individual Outreach Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

    /* HEADER */
    .header { background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%); border-bottom: 1px solid #30363d; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .header h1 span { color: #0077B5; }
    .header-meta { font-size: 11px; color: #8b949e; margin-top: 4px; }
    .stats { display: flex; gap: 20px; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat-num { font-size: 26px; font-weight: 800; color: #0077B5; }
    .stat-label { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }

    /* FILTERS */
    .filters { padding: 14px 32px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filter-btn { padding: 5px 14px; border-radius: 20px; border: 1px solid #30363d; background: transparent; color: #8b949e; cursor: pointer; font-size: 12px; transition: all 0.2s; }
    .filter-btn.active { background: #0077B5; border-color: #0077B5; color: white; }
    .filter-btn:hover:not(.active) { border-color: #0077B5; color: #58a6ff; }

    /* GRID */
    .container { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
    .section-title { font-size: 15px; font-weight: 700; color: #58a6ff; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #30363d; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; margin-bottom: 40px; }

    /* CARD */
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; transition: transform 0.2s, opacity 0.3s; }
    .card:hover { transform: translateY(-2px); border-color: #0077B5; }
    .card.hidden { display: none; }
    .card-header { padding: 14px 16px; background: #1c2128; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .prospect-name { font-size: 15px; font-weight: 700; color: #fff; }
    .meta { font-size: 12px; color: #58a6ff; margin-top: 2px; }
    .company { font-size: 11px; color: #8b949e; margin-top: 2px; }

    /* BADGES */
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .badge-new     { background: #1d4ed8; color: #bfdbfe; }
    .badge-t1      { background: #92400e; color: #fde68a; }
    .badge-t2      { background: #7c3aed; color: #ddd6fe; }
    .badge-t3      { background: #065f46; color: #a7f3d0; }
    .badge-done    { background: #374151; color: #9ca3af; }
    .badge-skipped { background: #374151; color: #9ca3af; }
    .badge-offbase { background: #7f1d1d; color: #fca5a5; }

    /* TOUCH TABS */
    .touch-tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
    .ttab { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; background: #0d1117; color: #8b949e; border: 1px solid #30363d; transition: all 0.2s; }
    .ttab.active { background: #1d4ed8; color: #bfdbfe; border-color: #1d4ed8; }
    .ttab.locked { opacity: 0.4; cursor: not-allowed; }
    .ttab.ready  { border-color: #4CAF50; color: #4CAF50; }

    /* COUNTDOWN */
    .countdown { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; margin: 8px 16px 0; display: inline-block; }
    .countdown.waiting { background: #1c2128; color: #f0883e; border: 1px solid #f0883e44; }
    .countdown.ready   { background: #052e16; color: #4CAF50; border: 1px solid #4CAF5044; }

    /* MESSAGE BOX */
    .message-box { padding: 10px 16px; }
    .message-label { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .char-count { color: #4CAF50; }
    .message-text { font-size: 13px; color: #c9d1d9; background: #0d1117; padding: 10px 12px; border-radius: 6px; border-left: 3px solid #0077B5; line-height: 1.5; margin-bottom: 8px; min-height: 52px; }
    .message-text.locked-msg { border-left-color: #30363d; color: #6b7280; font-style: italic; }
    .copy-btn { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s; }
    .copy-btn:hover:not(:disabled) { border-color: #0077B5; color: #58a6ff; }
    .copy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* FOOTER BUTTONS */
    .card-footer { padding: 10px 16px; border-top: 1px solid #30363d; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-linkedin { display: inline-flex; align-items: center; gap: 5px; background: #0077B5; color: white; text-decoration: none; padding: 5px 12px; border-radius: 5px; font-size: 12px; font-weight: 600; transition: background 0.2s; }
    .btn-linkedin:hover { background: #005885; }
    .btn-hubspot  { display: inline-flex; align-items: center; background: #ff7a59; color: white; text-decoration: none; padding: 5px 12px; border-radius: 5px; font-size: 12px; font-weight: 600; transition: background 0.2s; }
    .btn-hubspot:hover { background: #e05c3a; }
    .btn-sent   { background: transparent; border: 1px solid #4CAF50; color: #4CAF50; padding: 5px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; transition: all 0.2s; margin-left: auto; }
    .btn-sent:hover:not(:disabled) { background: #4CAF50; color: #000; }
    .btn-sent:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-skip   { background: transparent; border: 1px solid #8b949e; color: #8b949e; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
    .btn-skip:hover { border-color: #f0883e; color: #f0883e; }
    .btn-offbase { background: transparent; border: 1px solid #f85149; color: #f85149; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
    .btn-offbase:hover { background: #f85149; color: #fff; }

    /* LOADING / EMPTY */
    .loading { text-align: center; padding: 80px 20px; color: #8b949e; }
    .loading-spinner { font-size: 32px; animation: spin 1s linear infinite; display: block; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 60px 20px; color: #8b949e; }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { background: #da3633; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>CrewCast <span>Individual Outreach</span></h1>
    <p class="header-meta" id="last-updated">Loading...</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-new">—</div><div class="stat-label">T1 Ready</div></div>
    <div class="stat"><div class="stat-num" id="stat-t1">—</div><div class="stat-label">T2 Pending</div></div>
    <div class="stat"><div class="stat-num" id="stat-t2">—</div><div class="stat-label">T3 Pending</div></div>
    <div class="stat"><div class="stat-num" id="stat-done">—</div><div class="stat-label">Completed</div></div>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('ALL', this)">All</button>
  <button class="filter-btn" onclick="setFilter('NEW', this)">🔵 T1 Ready</button>
  <button class="filter-btn" onclick="setFilter('SENT_T1', this)">⏳ Awaiting T2</button>
  <button class="filter-btn" onclick="setFilter('T2_READY', this)">🟣 T2 Ready</button>
  <button class="filter-btn" onclick="setFilter('SENT_T2', this)">⏳ Awaiting T3</button>
  <button class="filter-btn" onclick="setFilter('T3_READY', this)">🟢 T3 Ready</button>
  <button class="filter-btn" onclick="setFilter('SENT_T3', this)">✅ Done</button>
  <button class="filter-btn" onclick="setFilter('SKIPPED', this)">⏭ Skipped</button>
</div>

<div class="container">
  <div id="grid-wrapper">
    <div class="loading"><span class="loading-spinner">⚙️</span>Loading prospects...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = 'https://base44.app/api/apps/6a274334d6b0962f39294123/functions';
  let allProspects = [];
  let currentFilter = 'ALL';

  // ── Cadence timing ──────────────────────────────────────────
  const T2_DAYS = 3;
  const T3_DAYS = 5;

  function daysSince(dateStr) {
    if (!dateStr) return null;
    const sent = new Date(dateStr + 'T00:00:00');
    const now  = new Date();
    const diff = (now - sent) / (1000 * 60 * 60 * 24);
    return Math.floor(diff);
  }

  function daysUntil(dateStr, required) {
    const ds = daysSince(dateStr);
    if (ds === null) return null;
    return required - ds;
  }

  // Compute the "effective status" for display + filtering
  function effectiveStatus(p) {
    if (p.status === 'SENT_T1') {
      const rem = daysUntil(p.t1_sent_date, T2_DAYS);
      if (rem !== null && rem <= 0) return 'T2_READY';
    }
    if (p.status === 'SENT_T2') {
      const rem = daysUntil(p.t2_sent_date, T3_DAYS - T2_DAYS);
      if (rem !== null && rem <= 0) return 'T3_READY';
    }
    return p.status;
  }

  // ── Load data ────────────────────────────────────────────────
  async function loadProspects() {
    try {
      const res  = await fetch(API_BASE + '/getProspects', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
      const data = await res.json();
      allProspects = data.prospects || [];
      renderAll();
      updateStats();
      document.getElementById('last-updated').textContent =
        'Live data · ' + new Date().toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }) + ' ET';
    } catch(e) {
      document.getElementById('grid-wrapper').innerHTML = '<div class="empty">⚠️ Error loading prospects. Refresh to try again.</div>';
    }
  }

  // ── Stats ────────────────────────────────────────────────────
  function updateStats() {
    const es = allProspects.map(effectiveStatus);
    document.getElementById('stat-new').textContent  = es.filter(s => s === 'NEW').length;
    document.getElementById('stat-t1').textContent   = es.filter(s => s === 'SENT_T1').length;
    document.getElementById('stat-t2').textContent   = es.filter(s => s === 'SENT_T2').length;
    document.getElementById('stat-done').textContent = allProspects.filter(p => p.status === 'SENT_T3' || p.status === 'OFF_BASE').length;
  }

  // ── Filter ───────────────────────────────────────────────────
  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAll();
  }

  function matchesFilter(p) {
    const es = effectiveStatus(p);
    if (currentFilter === 'ALL') return p.status !== 'OFF_BASE';
    if (currentFilter === 'T2_READY') return es === 'T2_READY';
    if (currentFilter === 'T3_READY') return es === 'T3_READY';
    return p.status === currentFilter;
  }

  // ── Render ───────────────────────────────────────────────────
  function renderAll() {
    const visible = allProspects.filter(matchesFilter);
    const wrapper = document.getElementById('grid-wrapper');

    if (visible.length === 0) {
      wrapper.innerHTML = '<div class="empty">🎉 Nothing here — try a different filter or add new prospects.</div>';
      return;
    }

    wrapper.innerHTML = `<div class="section-title">${visible.length} prospect${visible.length !== 1 ? 's' : ''}</div><div class="grid" id="main-grid"></div>`;
    const grid = document.getElementById('main-grid');
    visible.forEach(p => {
      const card = buildCard(p);
      grid.appendChild(card);
    });
  }

  // ── Build a card ─────────────────────────────────────────────
  function buildCard(p) {
    const es = effectiveStatus(p);
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.hubspot = p.hubspot_id;
    div.dataset.status  = p.status;

    // Badge
    const badgeInfo = {
      NEW:      ['badge-new',     '🔵 T1 Ready'],
      SENT_T1:  ['badge-t1',      '📤 T1 Sent — Awaiting T2'],
      T2_READY: ['badge-t2',      '🟣 T2 Ready'],
      SENT_T2:  ['badge-t2',      '📤 T2 Sent — Awaiting T3'],
      T3_READY: ['badge-t3',      '🟢 T3 Ready'],
      SENT_T3:  ['badge-done',    '✅ All Done'],
      SKIPPED:  ['badge-skipped', '⏭ Skipped'],
      OFF_BASE: ['badge-offbase', '🚫 Off Base'],
    }[es] || ['badge-new', '🔵 New'];

    const companyLine = [p.company, p.state].filter(Boolean).join(' · ');

    // Countdown banner
    let countdownHTML = '';
    if (p.status === 'SENT_T1' && p.t1_sent_date) {
      const rem = daysUntil(p.t1_sent_date, T2_DAYS);
      if (rem > 0) {
        countdownHTML = `<div class="countdown waiting">⏳ T2 unlocks in ${rem} day${rem !== 1 ? 's' : ''} (Day ${T2_DAYS})</div>`;
      } else {
        countdownHTML = `<div class="countdown ready">✅ T2 is ready to send!</div>`;
      }
    }
    if (p.status === 'SENT_T2' && p.t2_sent_date) {
      const rem = daysUntil(p.t2_sent_date, T3_DAYS - T2_DAYS);
      if (rem > 0) {
        countdownHTML = `<div class="countdown waiting">⏳ T3 unlocks in ${rem} day${rem !== 1 ? 's' : ''} (Day ${T3_DAYS})</div>`;
      } else {
        countdownHTML = `<div class="countdown ready">✅ T3 is ready to send!</div>`;
      }
    }

    // Which touch to show by default
    let defaultTab = 1;
    if (es === 'T2_READY' || p.status === 'SENT_T2') defaultTab = 2;
    if (es === 'T3_READY' || p.status === 'SENT_T3') defaultTab = 3;

    // Touch messages
    const t1 = p.touch1 || '(No T1 message saved)';
    const t2 = p.touch2 || '(T2 message not yet generated)';
    const t3 = p.touch3 || '(T3 message not yet generated)';

    // T2 locked until T2_DAYS, T3 locked until T3_DAYS
    const t2Unlocked = ['T2_READY', 'SENT_T2', 'T3_READY', 'SENT_T3'].includes(es);
    const t3Unlocked = ['T3_READY', 'SENT_T3'].includes(es);

    // Action button — what's the NEXT action?
    let actionBtn = '';
    if (p.status === 'NEW') {
      actionBtn = `<button class="btn-sent" onclick="markStatus('${p.hubspot_id}','SENT_T1',this)">✅ Mark T1 Sent</button>`;
    } else if (es === 'T2_READY') {
      actionBtn = `<button class="btn-sent" onclick="markStatus('${p.hubspot_id}','SENT_T2',this)">✅ Mark T2 Sent</button>`;
    } else if (es === 'T3_READY') {
      actionBtn = `<button class="btn-sent" onclick="markStatus('${p.hubspot_id}','SENT_T3',this)">✅ Mark T3 Sent</button>`;
    } else if (p.status === 'SENT_T3') {
      actionBtn = `<button class="btn-sent" disabled>✅ All Done</button>`;
    } else {
      // SENT_T1 waiting, SENT_T2 waiting
      actionBtn = `<button class="btn-sent" disabled>⏳ Waiting...</button>`;
    }

    const skipOffBase = p.status !== 'SENT_T3' && p.status !== 'OFF_BASE'
      ? `<button class="btn-skip"    onclick="markStatus('${p.hubspot_id}','SKIPPED',this)">⏭ Skip</button>
         <button class="btn-offbase" onclick="markStatus('${p.hubspot_id}','OFF_BASE',this)">🚫 Off Base</button>`
      : '';

    const hsLink = `https://app-na2.hubspot.com/contacts/246437386/record/0-1/${p.hubspot_id}`;

    div.innerHTML = `
      <div class="card-header">
        <div>
          <h3 class="prospect-name">${esc(p.name || 'Unknown')}</h3>
          <p class="meta">${esc(p.title || '')}</p>
          <p class="company">${esc(companyLine)}</p>
        </div>
        <span class="badge ${badgeInfo[0]}">${badgeInfo[1]}</span>
      </div>
      ${countdownHTML}
      <div class="touch-tabs" id="tabs-${p.hubspot_id}">
        <button class="ttab ${defaultTab===1?'active':''}" onclick="switchTab('${p.hubspot_id}',1,this)">T1 · Connect</button>
        <button class="ttab ${defaultTab===2?'active':''} ${!t2Unlocked?'locked':t2Unlocked&&defaultTab!==2?'ready':''}" onclick="switchTab('${p.hubspot_id}',2,this)" ${!t2Unlocked?'disabled':''}>T2 · Value</button>
        <button class="ttab ${defaultTab===3?'active':''} ${!t3Unlocked?'locked':t3Unlocked&&defaultTab!==3?'ready':''}" onclick="switchTab('${p.hubspot_id}',3,this)" ${!t3Unlocked?'disabled':''}>T3 · Follow-up</button>
      </div>
      <div class="message-box">
        <div class="message-label">
          <span id="touch-label-${p.hubspot_id}">Touch ${defaultTab} Message</span>
          <span class="char-count" id="char-count-${p.hubspot_id}"></span>
        </div>
        <div class="message-text ${defaultTab!==1&&!t2Unlocked?'locked-msg':''}" id="msg-${p.hubspot_id}">${esc(defaultTab===1?t1:defaultTab===2?t2:t3)}</div>
        <button class="copy-btn" id="copy-btn-${p.hubspot_id}" onclick="copyMsg('${p.hubspot_id}')" ${!t2Unlocked&&defaultTab>1?'disabled':''}>📋 Copy</button>
      </div>
      <div class="card-footer">
        <a href="${p.linkedin||'#'}" target="_blank" class="btn-linkedin">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          LinkedIn
        </a>
        <a href="${hsLink}" target="_blank" class="btn-hubspot">HubSpot</a>
        ${actionBtn}
        ${skipOffBase}
      </div>`;

    // Set initial char count
    updateCharCount(p.hubspot_id, defaultTab === 1 ? t1 : defaultTab === 2 ? t2 : t3);

    return div;
  }

  // ── Touch tab switching ──────────────────────────────────────
  const tabMessages = {}; // cache per card

  function switchTab(hid, tab, btn) {
    const p = allProspects.find(x => x.hubspot_id === hid);
    if (!p) return;

    document.querySelectorAll(`#tabs-${hid} .ttab`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const msgs = { 1: p.touch1 || '(No T1 message saved)', 2: p.touch2 || '(T2 message not yet generated)', 3: p.touch3 || '(T3 message not yet generated)' };
    const msgEl = document.getElementById(`msg-${hid}`);
    const labelEl = document.getElementById(`touch-label-${hid}`);
    const copyBtn = document.getElementById(`copy-btn-${hid}`);

    msgEl.textContent = msgs[tab];
    labelEl.textContent = `Touch ${tab} Message`;
    updateCharCount(hid, msgs[tab]);

    if (tab === 1) {
      msgEl.classList.remove('locked-msg');
      copyBtn.disabled = false;
    }
  }

  function updateCharCount(hid, text) {
    const el = document.getElementById(`char-count-${hid}`);
    if (!el || !text || text.startsWith('(')) { if(el) el.textContent=''; return; }
    const len = text.length;
    el.textContent = `${len} chars`;
    el.style.color = len <= 200 ? '#4CAF50' : '#f85149';
  }

  // ── Copy message ─────────────────────────────────────────────
  function copyMsg(hid) {
    const msgEl = document.getElementById(`msg-${hid}`);
    if (!msgEl) return;
    navigator.clipboard.writeText(msgEl.textContent).then(() => {
      const btn = document.getElementById(`copy-btn-${hid}`);
      btn.textContent = '✅ Copied!';
      setTimeout(() => btn.textContent = '📋 Copy', 2000);
      showToast('Message copied to clipboard!');
    });
  }

  // ── Mark status ──────────────────────────────────────────────
  async function markStatus(hid, newStatus, btn) {
    btn.disabled = true;
    btn.textContent = '...';

    try {
      const res = await fetch(API_BASE + '/updateProspectStatus', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hubspot_id: hid, status: newStatus })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);

      // Update local state
      const p = allProspects.find(x => x.hubspot_id === hid);
      if (p) {
        p.status = newStatus;
        if (newStatus === 'SENT_T1') p.t1_sent_date = data.t1_sent_date;
        if (newStatus === 'SENT_T2') p.t2_sent_date = data.t2_sent_date;
        if (newStatus === 'SENT_T3') p.t3_sent_date = data.t3_sent_date;
      }

      // If hiding from current view, fade card out
      if (newStatus === 'SKIPPED' || newStatus === 'OFF_BASE') {
        const card = btn.closest('.card');
        card.style.opacity = '0';
        setTimeout(() => { card.style.display = 'none'; updateStats(); }, 300);
      } else {
        // Re-render just this card in place
        const card = btn.closest('.card');
        const newCard = buildCard(p);
        card.replaceWith(newCard);
        updateStats();
      }

      const msgs = { SENT_T1: 'T1 marked sent ✅', SENT_T2: 'T2 marked sent ✅', SENT_T3: '🎉 All 3 touches complete!', SKIPPED: 'Skipped — carries over tomorrow', OFF_BASE: 'Marked Off Base' };
      showToast(msgs[newStatus] || 'Updated!');
    } catch(e) {
      btn.disabled = false;
      btn.textContent = 'Retry';
      showToast('Error saving — try again', true);
    }
  }

  // ── Toast ────────────────────────────────────────────────────
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Helpers ──────────────────────────────────────────────────
  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ─────────────────────────────────────────────────────
  loadProspects();
</script>
</body>
</html>
