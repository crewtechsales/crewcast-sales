<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrewCast — Individual Outreach</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;color:#1a202c}
header{background:#1a202c;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2d3748;position:sticky;top:0;z-index:100}
h1{font-size:18px;font-weight:700;margin:0}
.sub{font-size:12px;color:#a0aec0;margin-top:2px}
.nav{display:flex;gap:12px;align-items:center}
.nav a{color:#a0aec0;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px}
.nav a:hover{background:#2d3748;color:#fff}
.nav .active{background:#4299e1;color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat-num{font-size:22px;font-weight:700;color:#2d3748}
.stat-label{color:#718096;font-size:11px;margin-top:2px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:32px}
.card{background:#fff;border-radius:8px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .2s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-2px)}
.card.skipped{opacity:0.45}
.card.off-base{border:2px solid #f6ad55;opacity:0.55}
.card.bad-link{border:2px solid #fc8181}
.card-head{margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start}
.prospect-name{font-size:15px;font-weight:700;color:#1a202c}
.prospect-title{font-size:11px;color:#718096;margin-top:2px}
.prospect-company{font-size:12px;font-weight:600;color:#4299e1;margin-top:4px}
.status-badge{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap;margin-left:8px;flex-shrink:0}
.status-badge.new{background:#bee3f8;color:#2c5282}
.status-badge.sent{background:#c6f6d5;color:#22543d}
.status-badge.skipped{background:#e2e8f0;color:#4a5568}
.status-badge.off-base{background:#feebc8;color:#c05621}
.status-badge.bad-link{background:#fed7d7;color:#c53030}
.touch-block{margin:8px 0;padding:10px;background:#f7fafc;border-left:3px solid #4299e1;border-radius:0 4px 4px 0;font-size:12px;color:#4a5568;line-height:1.5}
.touch-block.t2{border-left-color:#9f7aea}
.touch-block.t3{border-left-color:#ed8936}
.touch-label{font-weight:700;color:#2d3748;font-size:11px;margin-bottom:3px}
.touch-label.t2{color:#553c9a}
.touch-label.t3{color:#7b341e}
.char-count{font-size:10px;color:#718096;text-align:right;margin-top:3px}
.char-count.over{color:#e53e3e;font-weight:700}
.card-actions{display:flex;gap:6px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.btn{padding:7px 10px;font-size:11px;border:none;border-radius:4px;cursor:pointer;transition:all .2s;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-copy{background:#4299e1;color:#fff;flex:1}
.btn-copy:hover:not(:disabled){background:#3182ce}
.btn-copy.copied{background:#48bb78}
.btn-linkedin{background:#0a66c2;color:#fff}
.btn-linkedin:hover:not(:disabled){background:#055199}
.btn-sent{background:#48bb78;color:#fff}
.btn-sent:hover:not(:disabled){background:#38a169}
.btn-sent.done{background:#276749}
.btn-skip{background:#e2e8f0;color:#4a5568}
.btn-skip:hover:not(:disabled){background:#cbd5e0}
.btn-offbase{background:#fff;color:#c05621;border:1px solid #f6ad55}
.btn-offbase:hover:not(:disabled){background:#feebc8}
.btn-offbase.flagged{background:#feebc8;color:#7b341e;border-color:#ed8936}
.btn-badlink{background:#fff;color:#c53030;border:1px solid #fc8181;font-size:10px}
.btn-badlink:hover:not(:disabled){background:#fff5f5}
.btn-badlink.flagged{background:#fff5f5;color:#9b2c2c}
.loading{text-align:center;padding:60px;color:#718096;font-size:14px;grid-column:1/-1}
footer{text-align:center;padding:24px;color:#718096;font-size:12px;border-top:1px solid #e2e8f0;margin-top:16px}
</style>

let statuses = {};

async function loadStatuses() {
  try {
    const r = await fetch(`${API_BASE}/getProspectStatuses`, {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const d = await r.json();
    if (d.statuses) d.statuses.forEach(s => statuses[s.hubspot_id] = s.status);
  } catch(e) { console.log('Status load failed:', e); }
}

function getStatus(hid) { return statuses[hid] || 'NEW'; }

function updateStats() {
  const total = PROSPECTS.length;
  const sent = PROSPECTS.filter(p => getStatus(p.hubspot_id) === 'SENT').length;
  const offbase = PROSPECTS.filter(p => getStatus(p.hubspot_id) === 'OFF_BASE').length;
  const badlink = PROSPECTS.filter(p => getStatus(p.hubspot_id) === 'BAD_LINK').length;
  const skipped = PROSPECTS.filter(p => getStatus(p.hubspot_id) === 'SKIPPED').length;
  const unsent = total - sent - offbase - badlink - skipped;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-sent').textContent = sent;
  document.getElementById('stat-unsent').textContent = Math.max(0, unsent);
  document.getElementById('stat-offbase').textContent = offbase;
  document.getElementById('stat-badlink').textContent = badlink;
}

function statusLabel(s) {
  const map = {NEW:'New',SENT:'Sent ✓',SKIPPED:'Skipped',OFF_BASE:'Off Base',BAD_LINK:'Bad Link'};
  return map[s] || s;
}

function renderCards() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';
  PROSPECTS.forEach(p => {
    const s = getStatus(p.hubspot_id);
    const t1len = p.touch1.length;
    const card = document.createElement('div');
    card.className = `card ${s==='SKIPPED'?'skipped':s==='OFF_BASE'?'off-base':s==='BAD_LINK'?'bad-link':''}`;
    card.id = `card-${p.hubspot_id}`;
    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="prospect-name">${p.name}</div>
          <div class="prospect-title">${p.title}</div>
          <div class="prospect-company">${p.company}</div>
        </div>
        <span class="status-badge ${s.toLowerCase().replace('_','-')}">${statusLabel(s)}</span>
      </div>
      <div class="touch-block">
        <div class="touch-label">Touch 1 — Connection Request</div>
        ${p.touch1}
        <div class="char-count ${t1len > 200 ? 'over' : ''}">${t1len}/200 chars${t1len > 200 ? ' ⚠️ OVER LIMIT' : ' ✓'}</div>
      </div>
      <div class="touch-block t2">
        <div class="touch-label t2">Touch 2 — Value Message</div>
        ${p.touch2}
      </div>
      <div class="touch-block t3">
        <div class="touch-label t3">Touch 3 — Follow-up</div>
        ${p.touch3}
      </div>
      <div class="card-actions">
        <button class="btn btn-copy" onclick="copyTouch(this,'${p.hubspot_id}',1)">📋 Copy T1</button>
        <button class="btn btn-copy" onclick="copyTouch(this,'${p.hubspot_id}',2)" style="background:#9f7aea">📋 T2</button>
        <button class="btn btn-copy" onclick="copyTouch(this,'${p.hubspot_id}',3)" style="background:#ed8936">📋 T3</button>
        <button class="btn btn-linkedin" onclick="openLinkedIn('${p.linkedin_url}','${p.hubspot_id}')">🔗 LinkedIn</button>
      </div>
      <div class="card-actions" style="margin-top:6px">
        <button class="btn btn-sent ${s==='SENT'?'done':''}" onclick="setStatus('${p.hubspot_id}','SENT',this)">✓ Sent</button>
        <button class="btn btn-skip" onclick="setStatus('${p.hubspot_id}','SKIPPED',this)">Skip</button>
        <button class="btn btn-offbase ${s==='OFF_BASE'?'flagged':''}" onclick="setStatus('${p.hubspot_id}','OFF_BASE',this)">🚫 Off Base</button>
        <button class="btn btn-badlink ${s==='BAD_LINK'?'flagged':''}" onclick="setStatus('${p.hubspot_id}','BAD_LINK',this)">🚩 Bad Link</button>
      </div>`;
    container.appendChild(card);
  });
  updateStats();
}

const touchMap = {};
PROSPECTS.forEach(p => { touchMap[p.hubspot_id] = p; });

async function copyTouch(btn, hid, num) {
  const p = touchMap[hid];
  const text = num===1 ? p.touch1 : num===2 ? p.touch2 : p.touch3;
  try {
    await navigator.clipboard.writeText(text);
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  } catch(e) {
    prompt('Copy this message:', text);
  }
}

function openLinkedIn(url, hid) {
  if (!url || !url.includes('/in/')) {
    setStatus(hid, 'BAD_LINK', null);
    alert('LinkedIn URL looks invalid — marked as Bad Link.');
    return;
  }
  window.open(url, '_blank');
}

async function setStatus(hid, status, btn) {
  statuses[hid] = status;
  const card = document.getElementById(`card-${hid}`);
  if (card) {
    card.className = `card ${status==='SKIPPED'?'skipped':status==='OFF_BASE'?'off-base':status==='BAD_LINK'?'bad-link':''}`;
    card.querySelectorAll('.status-badge').forEach(b => {
      b.className = `status-badge ${status.toLowerCase().replace('_','-')}`;
      b.textContent = statusLabel(status);
    });
  }
  updateStats();
  try {
    await fetch(`${API_BASE}/updateProspectStatus`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({hubspot_id: hid, status})
    });
  } catch(e) { console.log('Status save failed:', e); }
}

(async () => {
  await loadStatuses();
  renderCards();
})();
</script>
